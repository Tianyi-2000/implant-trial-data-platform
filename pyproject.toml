[project]
name = "itdp"
version = "0.1.0"
description = "Prototype data platform for implantable electrode array trial data (synthetic data only)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itdp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["req(id): the requirement in docs/requirements.yaml that this test verifies"]

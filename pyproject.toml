[project]
name = "itdp"
version = "0.1.0"
description = "Prototype data platform for implantable electrode array trial data (synthetic data only)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itdp"]
